<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WP прв колоквиум: теорија</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky HUD with lecture tabs; home dashboard; per lecture a section rail on the left and one lesson (script, sims, quiz) on the right */
:root{
  --bg:#eef1f6;
  --panel:#ffffff;
  --ink:#16213a;
  --muted:#5b6782;
  --line:#d5dbe7;
  --accent:#1f5eff;
  --accent-soft:#e3ebff;
  --xp:#c97a00;
  --xp-soft:#fff2d6;
  --ok:#14804a;
  --ok-soft:#dcf5e7;
  --bad:#c6293b;
  --bad-soft:#fde3e6;
  --code-bg:#f4f6fb;
  --font-display:"Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1524; --panel:#172036; --ink:#e7ecf7; --muted:#9aa7c4; --line:#2a3655;
    --accent:#6f9bff; --accent-soft:#1d2b52; --xp:#ffb53d; --xp-soft:#3a2c0f;
    --ok:#4fd18b; --ok-soft:#123826; --bad:#ff7180; --bad-soft:#401a22; --code-bg:#111a2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1524; --panel:#172036; --ink:#e7ecf7; --muted:#9aa7c4; --line:#2a3655;
  --accent:#6f9bff; --accent-soft:#1d2b52; --xp:#ffb53d; --xp-soft:#3a2c0f;
  --ok:#4fd18b; --ok-soft:#123826; --bad:#ff7180; --bad-soft:#401a22; --code-bg:#111a2e;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible, a:focus-visible, select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.25}
code,pre{font-family:var(--font-mono);font-size:.86em}
:not(pre)>code{background:var(--code-bg);border:1px solid var(--line);padding:0 .3em;border-radius:4px;white-space:nowrap}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;line-height:1.5;margin:12px 0}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hud-inner{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.01em;margin-right:auto}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.stat{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.pill.xp{background:var(--xp-soft);color:var(--xp);border-color:transparent}
.pill.streak{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.overall{flex:1 1 220px;min-width:180px;display:flex;flex-direction:column;gap:4px}
.overall .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--xp));border-radius:999px;transition:width .4s}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.warn{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}

/* Shell */
.shell{max-width:1240px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.rail{position:sticky;top:78px;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.rail h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 4px 4px}
.navitem{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px}
.navitem:hover{background:var(--panel);border-color:var(--line)}
.navitem.active{background:var(--panel);border-color:var(--accent);box-shadow:0 1px 0 var(--line)}
.navitem .n{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.navitem .t{font-size:14px;font-weight:600;line-height:1.3}
.navitem .mini{grid-column:2;height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.navitem .mini>i{display:block;height:100%;background:var(--ok)}
.here{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--xp-soft);color:var(--xp);padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:2px}
.deep{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:2px}

/* Lesson */
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.lesson-head{display:flex;flex-direction:column;gap:6px}
.lesson-head .num{font-family:var(--font-mono);color:var(--accent);font-weight:600;font-size:14px}
.lesson-head h1{font-family:var(--font-display);font-weight:700;font-size:28px;margin:0}
.lesson-head p{margin:0;color:var(--muted);max-width:68ch}
.script{max-width:72ch}
.script h2{font-size:19px;margin:22px 0 8px;font-weight:700}
.script h2:first-child{margin-top:0}
.script p{margin:8px 0}
.script ul{padding-left:20px;margin:8px 0}
.script li{margin:4px 0}
.analogy{border-left:4px solid var(--xp);background:var(--xp-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.analogy b{color:var(--xp)}
.key{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.trap{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.trap b{color:var(--bad)}
.tbl-wrap{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg);font-weight:600}
.section-title{font-family:var(--font-display);font-size:16px;font-weight:500;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.section-title .tag{font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px}

/* Diagrams */
.diag-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px}
.node{flex:1 0 110px;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:600;font-size:14px;background:var(--panel);transition:all .25s;position:relative}
.node small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.node.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-3px);box-shadow:0 6px 16px -8px var(--accent)}
.arrow{flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.stepbox{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:64px}
.stepbox .sn{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.urlbar{display:flex;align-items:center;gap:8px;background:var(--code-bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--font-mono);font-size:13px;margin:10px 0}
.urlbar .dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.seq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 0;margin-top:8px;min-width:520px}
.seq-wrap{overflow-x:auto}
.lane-h{text-align:center;font-weight:700;font-size:14px;padding:6px;border-bottom:2px solid var(--ink)}
.msg{position:relative;padding:4px 8px 10px;font-size:13px;text-align:center;opacity:.18;transition:opacity .3s}
.msg.show{opacity:1}
.msg::after{content:"";position:absolute;left:12%;right:12%;bottom:2px;height:2px;background:var(--accent)}
.msg.r::before{content:"";position:absolute;right:10%;bottom:-3px;border:6px solid transparent;border-left-color:var(--accent)}
.msg.l::before{content:"";position:absolute;left:10%;bottom:-3px;border:6px solid transparent;border-right-color:var(--accent)}
.msg.warn::after{background:var(--xp)}
.msg.warn.r::before{border-left-color:var(--xp)}
.msg.warn.l::before{border-right-color:var(--xp)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.fact{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.fact b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.console{background:#0d1322;color:#cfe0ff;font-family:var(--font-mono);font-size:13px;border-radius:10px;padding:12px 14px;min-height:140px;max-height:230px;overflow:auto;line-height:1.55}
.console .c-init{color:#ffcf6b}.console .c-svc{color:#8fe3b0}.console .c-des{color:#ff9aa6}.console .c-ev{color:#9db8ff}.console .c-dim{color:#7183a8}
.sim{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.box h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:13px;padding:2px 0;font-variant-numeric:tabular-nums}
.kv .v{font-weight:600}
.flash{animation:flash .7s}
@keyframes flash{0%{background:var(--xp-soft)}100%{background:transparent}}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.browser .top{background:var(--code-bg);padding:6px 10px;display:flex;gap:8px;align-items:center;font-family:var(--font-mono);font-size:12px;border-bottom:1px solid var(--line)}
.browser .body{padding:10px 14px;font-family:var(--font-mono);font-size:13px;min-height:72px;white-space:pre-wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--panel)}
.codepair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:8px 0;font-family:var(--font-mono);font-size:12.5px;overflow-x:auto}
.code .h{padding:2px 12px 6px;font-weight:700;font-size:12px;color:var(--muted)}
.code .ln{padding:1px 12px;white-space:pre;border-left:3px solid transparent}
.code .ln.hl{background:var(--xp-soft);border-left-color:var(--xp)}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}
.chip-f{padding:6px 12px;border-radius:8px;border:2px solid var(--line);font-family:var(--font-mono);font-size:13px;font-weight:600;transition:all .25s}
.chip-f.on{border-color:var(--xp);background:var(--xp-soft)}
.chip-f.hit{border-color:var(--ok);background:var(--ok-soft)}
.chip-f.miss{opacity:.45}
.maptbl td.hit{background:var(--ok-soft)}
.maptbl td.dim{color:var(--muted)}
select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}

/* Quiz */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.qdot{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--panel)}
.qdot.cur{border-color:var(--ink);border-width:2px}
.qdot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qdot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qtext{font-size:17px;font-weight:600;margin:0 0 6px;max-width:72ch}
.qhint{font-size:13px;color:var(--muted);margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mk{flex:0 0 20px;height:20px;border:2px solid var(--muted);border-radius:50%;margin-top:2px}
.opt.multi .mk{border-radius:5px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mk{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--panel)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt pre{margin:4px 0 0;font-size:12px}
.opt .otext{flex:1;min-width:0}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.pool.empty::before{content:"Сите картички се распоредени. Притисни Провери.";color:var(--muted);font-size:13px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.cat{border:2px solid var(--line);border-radius:12px;padding:8px;min-height:90px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s, background .15s}
.cat.target{border-color:var(--accent);background:var(--accent-soft)}
.cat .ch{font-weight:700;font-size:13px;font-family:var(--font-mono);padding:2px 4px}
.card-chip{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:14px;text-align:left;touch-action:manipulation}
.card-chip.picked{border-color:var(--xp);background:var(--xp-soft);box-shadow:0 0 0 2px var(--xp)}
.card-chip.right{border-color:var(--ok);background:var(--ok-soft)}
.card-chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.card-chip .fix{display:block;font-size:12px;color:var(--bad);font-weight:600}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.feedback{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15px}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback b.v{display:block;margin-bottom:4px}
.done{text-align:center;padding:12px 0}
.done .big{font-family:var(--font-display);font-size:34px;font-weight:700}
.done p{color:var(--muted);margin:6px 0 14px}

/* toast, modal */
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:999px;font-weight:700;z-index:50;pointer-events:none;opacity:0;transition:opacity .2s, transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(6px)}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border-radius:14px;padding:20px 22px;max-width:420px;width:100%;border:1px solid var(--line)}
.modal h3{margin:0 0 8px;font-family:var(--font-display);font-size:18px}
.lessonnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.review-banner{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

@media (max-width: 900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .rail h3{display:none}
  .navitem{flex:0 0 190px}
  .codepair{grid-template-columns:1fr}
}
@media (max-width: 480px){
  .card{padding:16px}
  .lesson-head h1{font-size:22px}
  .hud-inner{gap:10px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}


/* tabs + dashboard + exam additions */
.tabbar{border-top:1px solid var(--line);background:var(--panel)}
.tabbar-inner{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.ltab{flex:0 0 auto;border:0;background:transparent;padding:10px 14px 9px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ltab:hover{color:var(--ink)}
.ltab.on{color:var(--ink);border-bottom-color:var(--accent)}
.ltab .sc{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--code-bg);color:var(--muted)}
.ltab.on .sc{background:var(--accent-soft);color:var(--accent)}
.ltab.exam{color:var(--xp)}
.ltab.exam.on{border-bottom-color:var(--xp)}
.rail .lechead{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.rail .lechead b{font-family:var(--font-display);font-size:14px;font-weight:500}
.rail .lechead .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.homewrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:20px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch}
.hero h1{font-family:var(--font-display);font-size:30px;margin:0 0 6px;font-weight:700}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.tile b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile span{font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile small{display:block;color:var(--muted);font-size:12px}
.lecgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.lec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left}
.lec:hover{border-color:var(--accent)}
.lec .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lec .code{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600}
.lec h3{margin:2px 0 0;font-size:18px}
.lec p{margin:0;color:var(--muted);font-size:14px}
.lec .mode{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--code-bg);color:var(--muted);white-space:nowrap}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center;flex:0 0 54px}

.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.raw{background:#0d1322;color:#cfe0ff;font-family:var(--font-mono);font-size:12.5px;border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;line-height:1.55;margin:0;min-height:60px}
.raw .k{color:#ffcf6b}.raw .g{color:#8fe3b0}.raw .r{color:#ff9aa6}.raw .b{color:#9db8ff}.raw .d{color:#7183a8}

.ctl input[type=text]{font:inherit;font-family:var(--font-mono);font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
.ctlrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.gridbtn{display:flex;flex-wrap:wrap;gap:6px}

.c1{border-color:#7b8bb0 !important}.c2{border-color:var(--ok) !important}.c3{border-color:var(--accent) !important}.c4{border-color:var(--xp) !important}.c5{border-color:var(--bad) !important}

.tl-row{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.tl-track{position:relative;height:22px;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tl-seg{position:absolute;top:2px;bottom:2px;border-radius:4px;opacity:.25;transition:opacity .2s}

.result{border-radius:10px;padding:10px 14px;font-weight:600;margin-top:10px}

<header class="hud">
  <div class="hud-inner">
    <button class="brand" id="brandBtn" style="border:0;background:transparent;text-align:left;padding:0;cursor:pointer">Веб програмирање · прв колоквиум<small>Теорија · предавања 1 до 6</small></button>
    <span class="pill xp" id="hudXp">0 XP</span>

    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="mCancel">Откажи</button>

    </div>

<script>
/* ================= shared helpers (loaded before content files) ================= */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const C = s => `<pre><code>${esc(String(s).replace(/^\n/,""))}</code></pre>`;
const $ = (sel, root=document) => root.querySelector(sel);
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const LECTURES = [];
const DIAGRAMS = {};

/* Generic step-through diagram.
   cfg = {title, tag, nodes:[[name, small]], steps:[[nodeIndex | [indexes], text, raw?]], intro?} */
function stepper(el, cfg){
  let i = 0, timer = null;
  el.innerHTML = `<div class="section-title">${cfg.title||"Интерактивен дијаграм"} <span class="tag">${cfg.tag||""}</span></div>
    ${cfg.intro?`<p style="margin:0 0 8px;color:var(--muted);font-size:14px;max-width:70ch">${cfg.intro}</p>`:""}
    <div class="flow">${cfg.nodes.map((n,k)=>`${k?`<div class="arrow">${cfg.arrow||"→"}</div>`:""}<div class="node" data-n="${k}">${esc(n[0])}${n[1]?`<small>${esc(n[1])}</small>`:""}</div>`).join("")}</div>
    <div class="stepbox"><div class="sn"></div><div class="tx"></div></div>
    <pre class="raw st-raw" style="margin-top:8px;display:none"></pre>
    <div class="diag-controls"><button class="btn small" data-a="prev">← Назад</button><button class="btn small primary" data-a="next">Следно →</button><button class="btn small" data-a="play">Пушти</button></div>`;
  const draw = () => {
    const s = cfg.steps[i], on = Array.isArray(s[0]) ? s[0] : [s[0]];
    el.querySelectorAll(".node").forEach(n => n.classList.toggle("on", on.includes(+n.dataset.n)));
    $(".sn",el).textContent = `Чекор ${i+1} / ${cfg.steps.length}`;
    $(".tx",el).innerHTML = s[1];
    const r = $(".st-raw",el); if (s[2]) { r.style.display="block"; r.textContent = s[2]; } else r.style.display="none";
  };
  el.querySelector('[data-a="prev"]').onclick = () => { i = Math.max(0,i-1); draw(); };
  el.querySelector('[data-a="next"]').onclick = () => { i = Math.min(cfg.steps.length-1,i+1); draw(); };
  el.querySelector('[data-a="play"]').onclick = e => {
    if (timer){ clearInterval(timer); timer=null; e.target.textContent="Пушти"; return; }
    e.target.textContent="Стоп"; i=0; draw();
    timer = setInterval(()=>{ if (!document.body.contains(el)) return clearInterval(timer); if (i>=cfg.steps.length-1){clearInterval(timer);timer=null;e.target.textContent="Пушти";return;} i++; draw(); }, 2200);
  };
  draw();
}
/* colorize a raw HTTP message: first line, header names, body */
function rawHTTP(txt){
  const lines = txt.split("\n"); let inBody = false;
  return lines.map((l,k) => {
    if (k===0) return `<span class="k">${esc(l)}</span>`;
    if (inBody) return `<span class="g">${esc(l)}</span>`;
    if (l==="") { inBody = true; return ""; }
    const c = l.indexOf(":"); return c>0 ? `<span class="b">${esc(l.slice(0,c))}</span>:${esc(l.slice(c+1))}` : esc(l);
  }).join("\n");
}

</script>

<script>
/* ================= engine ================= */
LECTURES.sort((a,b) => a.id.localeCompare(b.id));
const allQ = [];
LECTURES.forEach(L => L.sections.forEach(s => { s.lec = L.id; s.questions.forEach((q,i) => { q.id = s.id + "-" + i; q.sec = s.id; q.lec = L.id; allQ.push(q); }); }));
const qById = id => allQ.find(q => q.id === id);
const secById = id => { for (const L of LECTURES) for (const s of L.sections) if (s.id === id) return s; return null; };
const lecById = id => LECTURES.find(L => L.id === id);
const lecQs = L => L.sections.flatMap(s => s.questions);

/* ---------- state ---------- */
const KEY = "wp-ch2-quiz-v1";
const fresh = () => ({xp:0, streak:0, best:0, ans:{}, xpGiven:{}, mistakes:[], cur:{}, last:{lec:"l3", sec:"params"}, lastLec:{}, exam:{best:null, history:[]}});
let st = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(fresh(), JSON.parse(raw)); } catch(e) {}
if (typeof st.last === "string") st.last = {lec: (secById(st.last)||{lec:"l3"}).lec, sec: st.last};
if (!st.exam) st.exam = {best:null, history:[]};
if (!st.lastLec) st.lastLec = {};
st.mistakes = st.mistakes.filter(id => qById(id));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };

function scoreOf(qs){ const a = qs.filter(q => st.ans[q.id]).length, ok = qs.filter(q => st.ans[q.id]==="ok").length; return {a, ok, n:qs.length, pct: qs.length? Math.round(ok/qs.length*100):0}; }

/* ---------- HUD + tabs ---------- */
function level(){ return Math.floor(st.xp/150)+1; }
let examRunning = null;
function renderHud(active){
  const sc = scoreOf(allQ);
  $("#hudXp").textContent = `${st.xp} XP · Ниво ${level()}`;
  $("#hudStreak").textContent = `Низа ${st.streak} · рекорд ${st.best}`;
  $("#hudPct").textContent = `${sc.ok} точни · ${sc.a} / ${sc.n} одговорени`;
  $("#hudBar").style.width = (sc.a/sc.n*100)+"%";
  const tabs = [["pregled","Преглед",""]].concat(LECTURES.map(L => [L.id, `${L.short} ${L.title}`, scoreOf(lecQs(L)).pct+"%"])).concat([["ispit","Испит", st.exam.best!=null? st.exam.best+"%":""],["greski","Грешки", String(st.mistakes.length)]]);
  $("#tabbar").innerHTML = tabs.map(([id,label,sc]) => `<button class="ltab ${id===active?"on":""} ${id==="ispit"?"exam":""}" data-tab="${id}">${esc(label)}${sc!==""?`<span class="sc">${sc}</span>`:""}</button>`).join("");
  $("#tabbar").querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
  const on = $("#tabbar .ltab.on"); if (on && on.scrollIntoView) { try { on.scrollIntoView({block:"nearest", inline:"nearest"}); } catch(e){} }
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1300); }
function go(h){ if (location.hash === "#"+h) route(); else location.hash = h; window.scrollTo({top:0}); }

/* ---------- routing ---------- */
let reviewMode = false;
function route(){
  if (examRunning && location.hash !== "#ispit") stopExam(false);
  const h = location.hash.replace("#","");
  reviewMode = false;
  const app = $("#app");
  if (!h || h === "pregled") return renderHome();
  if (h === "ispit") return renderExam();
  if (h === "greski") { reviewMode = true; return renderReview(); }
  const L = lecById(h);
  if (L) { const sid = st.lastLec[L.id] || L.sections[0].id; return renderSection(secById(sid)); }
  const s = secById(h);
  if (s) return renderSection(s);
  renderHome();
}
window.addEventListener("hashchange", route);

/* ---------- home ---------- */
function renderHome(){
  renderHud("pregled");
  const sc = scoreOf(allQ);
  const app = $("#app");
  const resume = st.last && secById(st.last.sec) ? secById(st.last.sec) : null;
  app.className = "homewrap";
  app.innerHTML = `
  <section class="hero">
    <div class="card">
      <h1>Прв колоквиум · теорија</h1>
      <p>Шест предавања, секое во свое јазиче. Л1 е само симулации со предизвици, Л2 до Л6 имаат скрипта, интерактивни дијаграми и мини-квиз. Секоја грешка оди во „Грешки“, а „Испит“ е мешан тест со тајмер како вистинскиот е-тест.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        ${resume?`<button class="btn primary" id="hResume">Продолжи: ${esc(lecById(resume.lec).short)} · ${esc(resume.title)}</button>`:""}
        <button class="btn" data-go="ispit">Започни испит</button>
        <button class="btn" data-go="greski">Повтори грешки (${st.mistakes.length})</button>
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><b>Вкупен резултат</b><span>${sc.pct}%</span><small>${sc.ok} од ${sc.n} точни од прв обид</small></div>
      <div class="tile"><b>Одговорени</b><span>${sc.a}/${sc.n}</span><small>прашања низ сите предавања</small></div>
      <div class="tile"><b>Испит рекорд</b><span>${st.exam.best!=null?st.exam.best+"%":"-"}</span><small>${st.exam.history.length} обиди</small></div>
      <div class="tile"><b>XP</b><span>${st.xp}</span><small>Ниво ${level()} · рекорд низа ${st.best}</small></div>
    </div>
  </section>
  <section class="lecgrid">
    ${LECTURES.map(L => { const s = scoreOf(lecQs(L)); return `
      <button class="lec" data-go="${L.id}">
        <div class="top"><div><div class="code">${L.short} · ${esc(L.deck)}</div><h3>${esc(L.title)}</h3></div><div class="ring" style="--p:${s.pct}"><i>${s.pct}%</i></div></div>
        <p>${esc(L.blurb)}</p>
        <div class="stats"><span><b>${s.ok}</b> точни</span><span><b>${s.a}/${s.n}</b> одговорени</span><span><b>${L.sections.length}</b> секции</span></div>
        <div class="bar"><i style="width:${s.a/s.n*100}%"></i></div>
        <span class="mode">${L.simOnly?"симулации + предизвици":"скрипта + симулации + квиз"}</span>
      </button>`; }).join("")}
  </section>
  <div style="display:flex;justify-content:flex-end"><button class="btn warn small" id="btnReset">Ресетирај сè</button></div>`;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  if (resume) $("#hResume").onclick = () => go(resume.id);
  $("#btnReset").onclick = () => $("#modal").classList.add("open");
}

/* ---------- lecture / section ---------- */
function renderRail(L, activeId){
  const s = scoreOf(lecQs(L));
  const r = $("#rail");
  r.innerHTML = `<div class="lechead"><b>${L.short} · ${esc(L.title)}</b><div class="row"><span>Резултат</span><span>${s.ok}/${s.n} · ${s.pct}%</span></div><div class="bar"><i style="width:${s.a/s.n*100}%"></i></div></div>` +
    L.sections.map(sec => {
      const done = sec.questions.filter(q => st.ans[q.id]).length;
      return `<button class="navitem ${sec.id===activeId?"active":""}" data-go="${sec.id}">
        <span class="n">${sec.num}</span>
        <span class="t">${esc(sec.title)}${sec.here?'<span class="here">тука си</span>':""}</span>
        <span class="mini"><i style="width:${done/sec.questions.length*100}%"></i></span>
      </button>`;
    }).join("");
  r.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
}
function shellLecture(){
  const app = $("#app");
  app.className = "shell";
  app.innerHTML = `<nav class="rail" id="rail" aria-label="Секции"></nav><main id="main"></main>`;
}
function renderSection(s){
  const L = lecById(s.lec);
  st.last = {lec:L.id, sec:s.id}; st.lastLec[L.id] = s.id; save();
  renderHud(L.id); shellLecture(); renderRail(L, s.id);
  const idx = L.sections.indexOf(s);
  const prev = L.sections[idx-1], next = L.sections[idx+1];
  const nextLec = !next ? LECTURES[LECTURES.indexOf(L)+1] : null;
  const diags = !s.diagram ? [] : Array.isArray(s.diagram) ? s.diagram : s.diagram.split("+");
  const badge = L.simOnly ? '<span class="deep" style="background:var(--xp-soft);color:var(--xp)">симулации</span>' : s.deep ? '<span class="deep">длабоко</span>' : '<span class="deep" style="background:var(--code-bg);color:var(--muted)">рекап</span>';
  const m = $("#main");
  m.innerHTML = `
    <div class="card lesson-head">
      <span class="num">${L.short} · ${s.num}${badge}${s.here?'<span class="here">тука си</span>':""}</span>
      <h1>${esc(s.title)}</h1>
      <p>${s.sub}</p>
    </div>
    ${s.script ? `<div class="card"><div class="section-title">Скрипта <span class="tag">прочитај прво</span></div><div class="script">${s.script}</div></div>` : ""}
    ${diags.map((d,i) => `<div class="card" id="diag-${i}"></div>`).join("")}
    <div class="card" id="quizCard"></div>
    <div class="lessonnav">
      ${prev?`<button class="btn" data-go="${prev.id}">← ${prev.num} ${esc(prev.title)}</button>`:"<span></span>"}
      ${next?`<button class="btn primary" data-go="${next.id}">${next.num} ${esc(next.title)} →</button>`: nextLec?`<button class="btn primary" data-go="${nextLec.id}">${nextLec.short} ${esc(nextLec.title)} →</button>`:"<span></span>"}
    </div>`;
  m.querySelectorAll(".lessonnav [data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  diags.forEach((d,i) => { const el = $("#diag-"+i); if (DIAGRAMS[d]) DIAGRAMS[d](el); else el.innerHTML = `<p>Дијаграмот ${esc(d)} не е пронајден.</p>`; });
  renderQuiz(s);
}

/* ---------- quiz ---------- */
function renderQuiz(s){
  const L = lecById(s.lec);
  const card = $("#quizCard");
  const qs = s.questions;
  let i = st.cur[s.id] ?? qs.findIndex(q => !st.ans[q.id]);
  if (i < 0 || i >= qs.length) i = qs.length;
  const label = L.simOnly ? "Предизвици" : "Мини-квиз";
  const dots = qs.map((q,k) => `<span class="qdot ${k===i?"cur":""} ${st.ans[q.id]==="ok"?"ok":st.ans[q.id]==="bad"?"bad":""}">${k+1}</span>`).join("");
  const head = `<div class="quiz-top"><div class="section-title" style="margin:0">${label} <span class="tag">${qs.length} прашања</span></div><div class="dots">${dots}</div></div>`;
  if (i === qs.length){
    const ok = qs.filter(q => st.ans[q.id]==="ok").length;
    const idx = L.sections.indexOf(s), next = L.sections[idx+1];
    card.innerHTML = head + `<div class="done"><div class="big">${ok} / ${qs.length}</div><p>${ok===qs.length?"Чисто! Секцијата е твоја.":"Точни од прв обид. Погрешните се во „Грешки“ за повторување."}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="qRetry">Пробај ја секцијата пак</button>
        ${next?`<button class="btn primary" id="qNext">Следна: ${esc(next.title)} →</button>`:""}
      </div></div>`;
    $("#qRetry").onclick = () => { qs.forEach(q => delete st.ans[q.id]); st.cur[s.id]=0; save(); renderSection(s); };
    if (next) $("#qNext").onclick = () => go(next.id);
    return;
  }
  const q = qs[i];
  mountQuestion(card, head, q, () => { st.cur[s.id] = i+1; save(); renderQuiz(s); renderRail(L, s.id); renderHud(L.id); });
}

function mountQuestion(card, head, q, onNext, exam){
  card.innerHTML = head + `<div id="qBody"></div>`;
  const body = $("#qBody", card);
  ({mc:mountMC, sort:mountSort, fill:mountFill})[q.type](body, q, onNext, exam);
}

function award(q, correct){
  if (correct){
    st.streak++; st.best = Math.max(st.best, st.streak);
    st.mistakes = st.mistakes.filter(id => id !== q.id);
    if (!st.xpGiven[q.id]){ const gain = 10 + Math.min(st.streak-1,5)*2; st.xp += gain; st.xpGiven[q.id]=1; toast(`+${gain} XP${st.streak>1?" · низа "+st.streak:""}`); }
    else toast(st.streak>1 ? `Точно · низа ${st.streak}` : "Точно");
  } else {
    st.streak = 0;
    if (!st.mistakes.includes(q.id)) st.mistakes.push(q.id);
  }
  if (!reviewMode || !st.ans[q.id]) st.ans[q.id] = correct ? "ok" : "bad";
  save(); renderHud(reviewMode ? "greski" : q.lec);
}
function feedbackHTML(correct, exp){
  return `<div class="feedback ${correct?"ok":"bad"}" role="status"><b class="v">${correct?"Точно.":"Не баш."}</b>${exp}</div>`;
}
function finishQ(body, q, correct, expHTML, onNext, exam){
  if (exam){ onNext(correct); return; }
  award(q, correct);
  $("#qFb", body).innerHTML = feedbackHTML(correct, expHTML);
  const a = $(".qactions", body);
  a.innerHTML = `<button class="btn primary" id="qNextBtn">Следно →</button>`;
  $("#qNextBtn", body).onclick = () => onNext(correct); $("#qNextBtn", body).focus();
}
const isCode = t => t.includes("\n") || /^[@a-zA-Z_.]+\(/.test(t) || /^@/.test(t) || /[;{}]$/.test(t.trim());
function optHTML(t){ return isCode(t) ? `<code style="white-space:pre-wrap">${esc(t)}</code>` : esc(t); }
function scenarioHTML(q){ return q.scenario ? `<div class="scenario">${q.scenario}</div>` : ""; }
function qHead(q, hint){ return `${scenarioHTML(q)}<p class="qtext">${esc(q.q)}</p>${q.code?C(q.code):""}<p class="qhint">${hint}</p>`; }

function mountMC(body, q, onNext, exam){
  const order = shuffle(q.opts.map((_,k)=>k));
  const sel = new Set();
  body.innerHTML = qHead(q, q.multi?"Повеќе точни одговори. Означи ги сите.":"Еден точен одговор.") +
    `<div class="opts">${order.map(k => `<button class="opt ${q.multi?"multi":""}" data-k="${k}"><span class="mk"></span><span class="otext">${optHTML(q.opts[k])}</span></button>`).join("")}</div>
    <div class="qactions"><button class="btn primary" id="qCheck" disabled>${exam?"Одговори →":"Провери"}</button></div><div id="qFb"></div>`;
  const btns = [...body.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (q.multi){ sel.has(k)?sel.delete(k):sel.add(k); } else { sel.clear(); sel.add(k); }
    btns.forEach(x => x.classList.toggle("sel", sel.has(+x.dataset.k)));
    $("#qCheck", body).disabled = sel.size===0;
  });
  $("#qCheck", body).onclick = () => {
    const ans = new Set(q.ans);
    const correct = sel.size===ans.size && [...sel].every(k=>ans.has(k));
    if (!exam) btns.forEach(b => { const k=+b.dataset.k; b.disabled=true; b.classList.remove("sel");
      if (ans.has(k) && sel.has(k)) b.classList.add("right");
      else if (!ans.has(k) && sel.has(k)) b.classList.add("wrong");
      else if (ans.has(k)) b.classList.add("missed"); });
    finishQ(body, q, correct, (correct?"":"Точните се означени со зелено. ") + q.exp, onNext, exam);
  };
}

function mountSort(body, q, onNext, exam){
  const items = shuffle(q.items.map((it,k)=>({t:it[0], c:it[1], k})));
  const place = {};
  let picked = null, locked = false;
  body.innerHTML = qHead(q, "Повлечи ја картичката во категорија, или кликни картичка па кликни категорија. Клик на распоредена картичка ја враќа.") +
    `<div class="pool" id="pool"></div><div class="cats" id="cats"></div>
    <div class="qactions"><button class="btn primary" id="qCheck" disabled>${exam?"Одговори →":"Провери"}</button></div><div id="qFb"></div>`;
  const pool = $("#pool", body), cats = $("#cats", body);
  function chip(it){
    const b = document.createElement("button");
    b.className = "card-chip" + (picked===it.k?" picked":"");
    b.textContent = it.t; b.draggable = !locked; b.dataset.k = it.k;
    b.ondragstart = e => { e.dataTransfer.setData("text/plain", it.k); picked = it.k; };
    b.onclick = () => { if (locked) return;
      if (place[it.k] !== undefined){ delete place[it.k]; picked=null; }
      else picked = picked===it.k ? null : it.k;
      draw(); };
    return b;
  }
  function draw(){
    pool.innerHTML = "";
    const inPool = items.filter(it => place[it.k]===undefined);
    inPool.forEach(it => pool.appendChild(chip(it)));
    pool.classList.toggle("empty", inPool.length===0);
    cats.innerHTML = "";
    q.cats.forEach(c => {
      const z = document.createElement("div"); z.className="cat"; z.tabIndex=0; z.setAttribute("role","button"); z.setAttribute("aria-label","Категорија "+c);
      z.innerHTML = `<div class="ch">${esc(c)}</div>`;
      items.filter(it => place[it.k]===c).forEach(it => z.appendChild(chip(it)));
      const drop = k => { if (locked || k===null || k===undefined || isNaN(k)) return; place[k]=c; picked=null; draw(); };
      z.onclick = e => { if (e.target.closest(".card-chip")) return; drop(picked); };
      z.onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); drop(picked);} };
      z.ondragover = e => { e.preventDefault(); z.classList.add("target"); };
      z.ondragleave = () => z.classList.remove("target");
      z.ondrop = e => { e.preventDefault(); drop(+e.dataTransfer.getData("text/plain")); };
      cats.appendChild(z);
    });
    $("#qCheck", body).disabled = inPool.length>0 || locked;
  }
  draw();
  $("#qCheck", body).onclick = () => {
    const correct = items.every(it => place[it.k]===it.c);
    if (!exam){
      locked = true; draw();
      cats.querySelectorAll(".card-chip").forEach(b => { const it = items.find(x=>x.k===+b.dataset.k);
        if (place[it.k]===it.c) b.classList.add("right");
        else { b.classList.add("wrong"); const f=document.createElement("span"); f.className="fix"; f.textContent="→ "+it.c; b.appendChild(f); } });
    }
    finishQ(body, q, correct, q.exp, onNext, exam);
  };
}

function mountFill(body, q, onNext, exam){
  body.innerHTML = qHead(q, "Избери вредност за секое поле.") +
    `<div class="fillrows">${q.rows.map((r,k) => { const idx = r[1].map((_,j)=>j); const ord = r[1].length <= 4 ? shuffle(idx) : idx;
      return `<label class="fl" for="f-${k}">${esc(r[0])}</label><select id="f-${k}" data-k="${k}"><option value="">избери…</option>${ord.map(j=>`<option value="${j}">${esc(r[1][j])}</option>`).join("")}</select>`; }).join("")}</div>
    <div class="qactions"><button class="btn primary" id="qCheck" disabled>${exam?"Одговори →":"Провери"}</button></div><div id="qFb"></div>`;
  const sels = [...body.querySelectorAll("select")];
  sels.forEach(s => s.onchange = () => { $("#qCheck", body).disabled = sels.some(x => x.value===""); });
  $("#qCheck", body).onclick = () => {
    let correct = true;
    sels.forEach(s => { const r = q.rows[+s.dataset.k]; const ok = +s.value === r[2]; if (!ok) correct = false;
      if (!exam){ s.disabled = true; s.classList.add(ok?"right":"wrong");
        if (!ok){ const f = document.createElement("div"); f.className="fix"; f.textContent = "→ " + r[1][r[2]]; s.after(f); } } });
    finishQ(body, q, correct, q.exp, onNext, exam);
  };
}

function correctAnswerHTML(q){
  if (q.type==="mc") return q.ans.map(k => optHTML(q.opts[k])).join("<br>");
  if (q.type==="sort") return q.items.map(it => `${esc(it[0])} → <b>${esc(it[1])}</b>`).join("<br>");
  return q.rows.map(r => `<code>${esc(r[0])}</code> → <b>${esc(r[1][r[2]])}</b>`).join("<br>");
}

/* ---------- review ---------- */
function renderReview(){
  renderHud("greski");
  const app = $("#app"); app.className = "homewrap";
  const list = st.mistakes.slice();
  if (!list.length){
    app.innerHTML = `<div class="card lesson-head"><span class="num">Повторување</span><h1>Нема грешки за повторување</h1><p>Секое прашање што ќе го промашиш (во квиз или на испит) завршува тука. Кога ќе го решиш точно во ова повторување, излегува од листата.</p></div>`;
    return;
  }
  const byLec = LECTURES.map(L => [L, list.filter(id => qById(id).lec===L.id).length]).filter(x=>x[1]);
  let i = 0;
  const queue = shuffle(list);
  app.innerHTML = `<div class="review-banner"><div><b>Повторување на грешки</b> · ${queue.length} прашања · ${byLec.map(([L,n])=>`${L.short}: ${n}`).join(" · ")}</div><button class="btn small" id="rExit">Излези</button></div><div class="card" id="quizCard"></div>`;
  $("#rExit").onclick = () => go("pregled");
  const step = () => {
    const card = $("#quizCard");
    if (i >= queue.length){
      const left = st.mistakes.filter(id=>queue.includes(id)).length;
      card.innerHTML = `<div class="done"><div class="big">${queue.length - left} / ${queue.length}</div><p>поправени во ова повторување. Останати грешки: ${st.mistakes.length}.</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="rAgain">Уште еден круг</button><button class="btn primary" id="rBack">Назад на преглед</button></div></div>`;
      $("#rAgain").onclick = renderReview; $("#rBack").onclick = () => go("pregled");
      renderHud("greski"); return;
    }
    const q = qById(queue[i]);
    const s = secById(q.sec), L = lecById(q.lec);
    const head = `<div class="quiz-top"><div class="section-title" style="margin:0">${L.short} · ${s.num} ${esc(s.title)} <span class="tag">${i+1} / ${queue.length}</span></div></div>`;
    mountQuestion(card, head, q, () => { i++; step(); });
  };
  step();
}

/* ---------- exam ---------- */
let examCfg = {count:20, lecs:null};
function renderExam(){
  renderHud("ispit");
  const app = $("#app"); app.className = "homewrap";
  if (!examCfg.lecs) examCfg.lecs = LECTURES.map(L=>L.id);
  const hist = st.exam.history.slice(-5).reverse();
  app.innerHTML = `
    <div class="card lesson-head"><span class="num">Испит</span><h1>Мешан тест со тајмер</h1>
      <p>Случајни прашања од избраните предавања. Нема повратна информација додека не завршиш, исто како на е-тестот. На крај гледаш резултат по предавање и ги прегледуваш грешките, а тие одат во „Грешки“. Тајмерот е 75 секунди по прашање.</p></div>
    <div class="card" style="display:flex;flex-direction:column;gap:16px">
      <div><div class="section-title">Број на прашања</div><div class="seg" id="exCount">${[10,20,30,45].map(n=>`<button data-n="${n}" class="${examCfg.count===n?"on":""}">${n}</button>`).join("")}</div></div>
      <div><div class="section-title">Предавања</div><div class="chk">${LECTURES.map(L=>`<label><input type="checkbox" value="${L.id}" ${examCfg.lecs.includes(L.id)?"checked":""}> ${L.short} ${esc(L.title)}</label>`).join("")}</div></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="exStart">Започни</button><span id="exInfo" style="color:var(--muted);font-size:14px"></span></div>
    </div>
    <div class="card"><div class="section-title">Претходни обиди <span class="tag">рекорд ${st.exam.best!=null?st.exam.best+"%":"-"}</span></div>
      ${hist.length? `<div class="breakdown">${hist.map(h=>`<div class="tile"><b>${new Date(h.t).toLocaleDateString("mk-MK")} · ${h.n} пр.</b><span>${h.pct}%</span><small>${h.ok}/${h.n} точни · ${Math.floor(h.sec/60)}:${String(h.sec%60).padStart(2,"0")} мин</small></div>`).join("")}</div>` : `<p style="color:var(--muted);margin:0">Уште нема обиди.</p>`}</div>`;
  const info = () => { const pool = allQ.filter(q => examCfg.lecs.includes(q.lec)).length; const n = Math.min(examCfg.count, pool);
    $("#exInfo").textContent = pool ? `${n} прашања · ${Math.ceil(n*75/60)} минути · од базен од ${pool}` : "Избери барем едно предавање.";
    $("#exStart").disabled = !pool; };
  app.querySelectorAll("#exCount button").forEach(b => b.onclick = () => { examCfg.count=+b.dataset.n; app.querySelectorAll("#exCount button").forEach(x=>x.classList.toggle("on",x===b)); info(); });
  app.querySelectorAll(".chk input").forEach(c => c.onchange = () => { examCfg.lecs = [...app.querySelectorAll(".chk input:checked")].map(x=>x.value); info(); });
  $("#exStart").onclick = startExam;
  info();
}
function startExam(){
  const pool = shuffle(allQ.filter(q => examCfg.lecs.includes(q.lec)));
  const qs = pool.slice(0, Math.min(examCfg.count, pool.length));
  const total = Math.ceil(qs.length*75);
  examRunning = {qs, i:0, res:[], left:total, total, timer:null};
  const app = $("#app");
  app.innerHTML = `<div class="exam-banner"><div><b>Испит</b> · прашање <span id="exN">1</span> / ${qs.length}</div><div class="t" id="exT"></div><button class="btn small" id="exEnd">Заврши сега</button></div><div class="card" id="quizCard"></div>`;
  $("#exEnd").onclick = () => finishExam();
  const tick = () => { const e = examRunning; if (!e) return; const t = $("#exT"); if (!t) return;
    t.textContent = `${Math.floor(e.left/60)}:${String(e.left%60).padStart(2,"0")}`; t.classList.toggle("low", e.left<=60);
    if (e.left<=0) return finishExam(); e.left--; };
  tick(); examRunning.timer = setInterval(tick, 1000);
  const step = () => {
    const e = examRunning; if (!e) return;
    if (e.i >= e.qs.length) return finishExam();
    $("#exN").textContent = e.i+1;
    const q = e.qs[e.i], L = lecById(q.lec);
    mountQuestion($("#quizCard"), `<div class="quiz-top"><div class="section-title" style="margin:0">${L.short} · ${esc(L.title)}</div></div>`, q, correct => { e.res.push({q, correct}); e.i++; step(); }, true);
  };
  step();
}
function stopExam(){ if (examRunning){ clearInterval(examRunning.timer); examRunning = null; } }
function finishExam(){
  const e = examRunning; if (!e) return;
  clearInterval(e.timer); examRunning = null;
  e.qs.slice(e.res.length).forEach(q => e.res.push({q, correct:false, skipped:true}));
  const ok = e.res.filter(r=>r.correct).length, n = e.res.length, pct = Math.round(ok/n*100);
  e.res.forEach(r => { if (!r.correct && !st.mistakes.includes(r.q.id)) st.mistakes.push(r.q.id); });
  st.xp += ok*5;
  st.exam.history.push({t:Date.now(), n, ok, pct, sec:e.total-Math.max(0,e.left)});
  const newBest = st.exam.best==null || pct > st.exam.best; if (newBest) st.exam.best = pct;
  save(); renderHud("ispit");
  const per = LECTURES.map(L => { const rs = e.res.filter(r=>r.q.lec===L.id); return [L, rs.filter(r=>r.correct).length, rs.length]; }).filter(x=>x[2]);
  const wrong = e.res.filter(r=>!r.correct);
  const app = $("#app");
  app.innerHTML = `
    <div class="card lesson-head"><span class="num">Резултат${newBest?' <span class="here">нов рекорд</span>':""}</span><h1>${ok} / ${n} · ${pct}%</h1><p>+${ok*5} XP. Погрешните (${wrong.length}) се додадени во „Грешки“.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn primary" id="exAgain">Нов испит</button><button class="btn" data-go="greski">Повтори грешки</button></div></div>
    <div class="card"><div class="section-title">По предавање</div><div class="breakdown">${per.map(([L,o,t])=>`<div class="tile"><b>${L.short} ${esc(L.title)}</b><span>${o}/${t}</span><small>${Math.round(o/t*100)}%</small></div>`).join("")}</div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="section-title">Преглед на погрешните <span class="tag">${wrong.length}</span></div>
      ${wrong.length? wrong.map(r => { const s = secById(r.q.sec); return `<div class="review-item bad"><span class="src">${lecById(r.q.lec).short} · ${s.num} ${esc(s.title)}${r.skipped?" · неодговорено":""}</span><b>${esc(r.q.q)}</b><div class="ca">Точно: ${correctAnswerHTML(r.q)}</div><div style="font-size:14px;color:var(--muted)">${r.q.exp}</div></div>`; }).join("") : `<p style="margin:0">Ниту една грешка. Браво.</p>`}
    </div>`;
  $("#exAgain").onclick = renderExam;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
}

/* ---------- global ---------- */
$("#mCancel").onclick = () => $("#modal").classList.remove("open");
$("#mOk").onclick = () => { st = fresh(); save(); $("#modal").classList.remove("open"); go("pregled"); toast("Напредокот е ресетиран"); };
document.addEventListener("keydown", e => { if (e.key==="Escape") $("#modal").classList.remove("open"); });
route();

document.getElementById("brandBtn").onclick = () => go("pregled");
</script>
