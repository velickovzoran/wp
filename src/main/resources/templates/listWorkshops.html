<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Workshop Registration - Choose a Workshop</title>
    <style type="text/css">
        body { width: 800px; margin: auto; font-family: Arial, sans-serif; }
        h1 { color: #333; }
        form { margin-top: 20px; }
        .workshop-option { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .workshop-option:hover { background-color: #f5f5f5; }
        .error { color: red; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, td, th { border: 1px solid #333; }
        td, th { padding: 8px; }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Workshop Registration App</h1>
</header>
<main>
    <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form action="/workshops" method="GET">
        <h2>Search workshops:</h2>
        <label>Title or category contains:</label>
        <input type="text" name="text" th:value="${text}">
        <label>Max price:</label>
        <input type="number" name="maxPrice" min="0" step="0.01" th:value="${maxPrice}">
        <input type="submit" value="Search">
    </form>

    <h2>Manage workshops:</h2>
    <a href="/workshops/workshop-form">Add new workshop</a>
    <table>
        <tr>
            <th>Title</th><th>Category</th><th>Price</th><th>Free seats</th><th>Instructor</th><th>Actions</th>
        </tr>
        <tr th:each="w : ${workshops}">
            <td th:text="${w.title}"></td>
            <td th:text="${w.category}"></td>
            <td th:text="${w.price} + ' MKD'"></td>
            <td th:text="${w.capacity}"></td>
            <td th:text="${w.instructor != null} ? ${w.instructor.name + ' ' + w.instructor.surname} : '-'"></td>
            <td>
                <a th:href="@{/workshops/workshop-form/{id}(id=${w.id})}">Edit</a>
                <form th:action="@{/workshops/delete/{id}(id=${w.id})}" method="POST" style="display:inline; margin:0">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <form action="/registration" method="POST">
        <h2>Choose a workshop:</h2>
        <div class="workshop-option" th:each="w : ${workshops}">
            <input type="radio" name="workshopTitle"
                   th:value="${w.title}"
                   th:id="'w' + ${w.id}"
                   th:disabled="${w.capacity == 0}">
            <label th:for="'w' + ${w.id}"
                   th:text="'Title: ' + ${w.title} + ', Category: ' + ${w.category} + ', Price: ' + ${w.price} + ' MKD, Free seats: ' + ${w.capacity} + (${w.instructor != null} ? ', Instructor: ' + ${w.instructor.name} + ' ' + ${w.instructor.surname} : '')">
            </label>
        </div>

        <h2>Enter your information:</h2>
        <label>Your Name:</label>
        <input type="text" name="participantName" required><br/>
        <label>Your Email:</label>
        <input type="email" name="participantEmail" required><br/>

        <h2>Choose number of seats:</h2>
        <input type="number" name="numSeats" min="1" required><br/>
        <br/>
        <input type="submit" value="Register">
    </form>
</main>
</body>
</html>
